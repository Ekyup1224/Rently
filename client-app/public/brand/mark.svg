<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rently mark — the toono, the roof-crown of a traditional Mongolian ger.
       Full-bleed square, no baked-in corner rounding: this is the source used
       to generate icon-192.png / icon-512.png / apple-icon.png in ../ , and
       any OS icon mask (circle, squircle, rounded square) applies its own
       shape on top of it. Change the mark here, then re-render those PNGs —
       never hand-edit the PNGs. -->
  <rect width="64" height="64" fill="#b84b2a"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#fbf6f1" stroke-width="4.5"/>
  <g stroke="#fbf6f1" stroke-width="4.5" stroke-linecap="round">
    <line x1="32" y1="9" x2="32" y2="21"/>
    <line x1="32" y1="43" x2="32" y2="55"/>
    <line x1="9" y1="32" x2="21" y2="32"/>
    <line x1="43" y1="32" x2="55" y2="32"/>
    <line x1="16.5" y1="16.5" x2="24.4" y2="24.4"/>
    <line x1="39.6" y1="39.6" x2="47.5" y2="47.5"/>
    <line x1="47.5" y1="16.5" x2="39.6" y2="24.4"/>
    <line x1="24.4" y1="39.6" x2="16.5" y2="47.5"/>
  </g>
  <circle cx="32" cy="32" r="7" fill="#fbf6f1"/>
</svg>
