# Local development infrastructure. Application processes run on the host
# (mvnw spring-boot:run / npm run dev) and talk to these containers.
services:
  postgres:
    image: postgres:18-alpine
    container_name: stay-postgres
    environment:
      POSTGRES_DB: stay
      POSTGRES_USER: stay
      POSTGRES_PASSWORD: stay_dev_password
    ports:
      - "5433:5432"   # 5433 on the host to avoid clashing with a local Postgres install
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stay -d stay"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: stay-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"   # 6380 on the host for the same reason
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: stay-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: stayminio
      MINIO_ROOT_PASSWORD: stayminio_dev_password
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  minio-data:
