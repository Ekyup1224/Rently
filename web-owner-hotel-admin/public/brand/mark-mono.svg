<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rently mark, outline-only, colored via currentColor — for inline use
       inside a component on top of an existing background (a colored badge,
       a dark header), instead of the flat-bg mark.svg. -->
  <circle cx="32" cy="32" r="25" stroke="currentColor" stroke-width="5"/>
  <g stroke="currentColor" stroke-width="5" stroke-linecap="round">
    <line x1="32" y1="8" x2="32" y2="21"/>
    <line x1="32" y1="43" x2="32" y2="56"/>
    <line x1="8" y1="32" x2="21" y2="32"/>
    <line x1="43" y1="32" x2="56" y2="32"/>
  </g>
  <circle cx="32" cy="32" r="7.5" fill="currentColor"/>
</svg>
