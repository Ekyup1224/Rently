spring:
  application:
    name: stay-backend
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5433/stay}
    username: ${POSTGRES_USER:stay}
    password: ${POSTGRES_PASSWORD:stay_dev_password}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only verifies that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 2s
  jackson:
    default-property-inclusion: non_null
    deserialization:
      # Jackson 3 rejects a missing JSON field mapped onto a primitive. Defaulting
      # it instead lets Bean Validation report which field is actually missing,
      # rather than the client getting an opaque parse error.
      fail-on-null-for-primitives: false

server:
  port: 8080
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  cors:
    # Vite admin/owner/hotel portal and Next.js guest PWA
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
  security:
    jwt:
      issuer: stay-backend
      # HS256 secret; must be >= 32 bytes. Override in every non-dev environment.
      secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long!!}
      access-token-ttl: 15m
      refresh-token-ttl: 30d
  otp:
    code-length: 6
    ttl: 5m
    max-verify-attempts: 5
    resend-cooldown: 60s
    max-per-hour: 5
    lockout: 15m
    # Dev convenience: OTP codes are logged instead of sent by SMS. A deployment
    # sets OTP_DELIVERY=sms.
    delivery: ${OTP_DELIVERY:log}
    # Dev convenience, and nothing else: the code comes back in the request
    # response so a local sign-in does not mean tailing the log. Deploying sets
    # OTP_DELIVERY=sms, which disables this on its own even if the flag is left
    # on, and OTP_EXPOSE_CODE=false turns it off outright.
    expose-code-in-response: ${OTP_EXPOSE_CODE:true}
  trust:
    # Released 24 hours after check-in day starts: long enough for a guest to
    # arrive and report a listing that does not exist, short enough that honest
    # hosts are not pushed towards off-platform payment.
    payout-hold: 24h
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:stay-media}
      access-key: ${S3_ACCESS_KEY:stayminio}
      secret-key: ${S3_SECRET_KEY:stayminio_dev_password}
      # MinIO needs path-style addressing; real S3 accepts it too.
      path-style-access: true
      public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9000/stay-media}
      presign-ttl: 5m
      max-photo-bytes: 10485760
      # Dev convenience: creates the bucket and opens the photo prefix for public
      # reads. Leave this false in production and front the bucket with a CDN.
      auto-create-bucket: ${S3_AUTO_CREATE_BUCKET:true}
  booking:
    # How long a PENDING_PAYMENT booking holds its dates before the expiry job
    # releases them.
    payment-hold: 30m
    # How long a host has to answer a request-to-book.
    host-response-window: 24h
    max-nights-ahead: 540
    # Mongolian VAT treatment of short-term rentals needs the legal review the
    # spec calls for, so tax is off until someone qualified says otherwise.
    tax-percent: 0
  payments:
    default-provider: SIMULATED
    simulated:
      # Stands in for QPay until merchant credentials exist. MUST be false in
      # any deployed environment: it exposes an endpoint that marks a payment
      # settled without money moving.
      enabled: ${PAYMENTS_SIMULATED_ENABLED:true}
      callback-secret: ${PAYMENTS_SIMULATED_SECRET:dev-simulated-callback-secret-change-me}
  bootstrap:
    super-admin:
      enabled: true
      phone: ${BOOTSTRAP_ADMIN_PHONE:+97699000000}
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@stay.local}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:ChangeMe123!}

logging:
  level:
    mn.innex.stay: DEBUG
